databases:
  - name: easydrop-db
    databaseName: easydrop
    user: easydrop
    plan: free          # free DB expires after a while: switch to a paid plan for real use
services:
  - type: web
    name: easydrop-api
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.3}
      - {key: DATABASE_URL, fromDatabase: {name: easydrop-db, property: connectionString}}
      - {key: SECRET_KEY, generateValue: true}
      - {key: DEBUG, value: "0"}
